name: Maven CI/CD
on:
  push:
    branches: [master]
    tags: [v*]
  workflow_dispatch:
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-web/src/main/webapp/package-lock.json
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y -q --no-install-recommends install ffmpeg mediainfo tesseract-ocr
          sudo npm install -g grunt-cli
      - name: Build with Maven
        run: mvn --batch-mode -Pprod clean install
      - name: Upload war artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-ci.war
          path: docs-web/target/docs*.war
